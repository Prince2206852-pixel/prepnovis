spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/prepnovis
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-3.5-flash
  base-url: https://generativelanguage.googleapis.com/v1beta