name: Keep Render Backend Alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Wake and wait for Render backend
        run: |
          for i in {1..15}; do
            echo "Health check attempt ..."
            status=$(curl -s -o /dev/null -w "%{http_code}" https://prepnovis-backend.onrender.com/actuator/health)

            if [ "$status" = "200" ]; then
              echo "Render backend is healthy."
              exit 0
            fi

            echo "Backend returned HTTP . Waiting 20 seconds..."
            sleep 20
          done

          echo "Render backend did not become healthy within 5 minutes."
          exit 1

      - name: Verify Render backend
        run: |
          sleep 20
          curl --fail --silent --show-error https://prepnovis-backend.onrender.com/actuator/health
